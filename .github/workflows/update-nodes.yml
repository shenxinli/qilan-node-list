name: Update nodes.txt

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      node_count:
        type: string
        required: false
      min_score:
        type: string
        required: false
      max_score:
        type: string
        required: false
      sort:
        type: string
        required: false
      region:
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: update-nodes
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate nodes.txt (primary)
        id: generate_primary
        continue-on-error: true
        env:
          COOKIE: ${{ secrets.QILAN_COOKIE }}
          NODE_COUNT: ${{ inputs.node_count && inputs.node_count || '1000' }}
          MIN_SCORE: ${{ inputs.min_score && inputs.min_score || '0' }}
          MAX_SCORE: ${{ inputs.max_score && inputs.max_score || '101' }}
          SORT: ${{ inputs.sort && inputs.sort || 'newest' }}
          REGION: ${{ inputs.region && inputs.region || '' }}
        run: node scripts/update-nodes.mjs

      - name: Generate nodes.txt (fallback public)
        if: steps.generate_primary.outcome != 'success'
        env:
          FORCE_PUBLIC: '1'
          PUBLIC_LIMIT: '1000'
          RETRY_COUNT: '3'
          RETRY_DELAY_MS: '800'
        run: node scripts/update-nodes.mjs

      - name: Upload nodes.txt artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nodes.txt
          path: nodes.txt
          if-no-files-found: warn

      - name: Commit and push
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nodes.txt
          git commit -m "chore: update nodes.txt" || true
          if ! git push; then
            echo "Push failed. nodes.txt has been uploaded as an artifact for this run."
            exit 0
          fi
