name: Update nodes.txt

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-nodes
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate nodes files
        env:
          COOKIE: ${{ secrets.QILAN_COOKIE }}
          AUTHORIZATION: ${{ secrets.QILAN_AUTHORIZATION }}
          EXTRA_HEADERS_JSON: ${{ secrets.QILAN_EXTRA_HEADERS_JSON }}
        run: |
          if [ -z "$COOKIE" ]; then
            echo "Missing secrets.QILAN_COOKIE. The API masks link values without a registered-member cookie, so nodes files cannot be generated."
            exit 1
          fi
          NODE_COUNT=1000 MIN_SCORE=54 MAX_SCORE=101 SORT=newest REGION='' OUTPUT_FILE=nodes.txt OUTPUT_FORMAT=base64 MIN_LINKS=1 node scripts/update-nodes.mjs
          wc -c nodes.txt || true
          NODE_COUNT=20000 MIN_SCORE=0 MAX_SCORE=101 SORT=newest REGION='' OUTPUT_FILE=nodes_all.txt OUTPUT_FORMAT=base64 MIN_LINKS=1000 node scripts/update-nodes.mjs
          wc -c nodes_all.txt || true

      - name: Upload nodes artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nodes
          path: |
            nodes.txt
            nodes_all.txt
          if-no-files-found: warn

      - name: Commit and push
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nodes.txt
          git add -f nodes_all.txt
          git commit -m "chore: update nodes files" || true
          if ! git push; then
            echo "Push failed. nodes files have been uploaded as an artifact for this run."
            exit 0
          fi
